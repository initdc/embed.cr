# This CI job installs Crystal and shard dependencies, then executes `crystal spec` to run the test suite
# More configuration options are available at https://crystal-lang.github.io/install-crystal/configurator.html

name: test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - dev
      - wip

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-latest
          - macos-latest
          - windows-latest
        crystal:
          - 1.0.0
          - latest
        exclude:
          - os: windows-latest
            crystal: 1.0.0
          - os: macos-latest
            crystal: 1.0.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      # - name: Install shards --ignore-crystal-version
      #   run: shards install
      - name: Check formatting
        run: crystal tool format --check
        if: ${{ matrix.os == 'ubuntu-latest' }}
      - name: Run tests
        run: crystal spec --verbose
